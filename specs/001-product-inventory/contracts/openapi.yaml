openapi: 3.0.1
info:
  title: Product Inventory API
  version: v1
  description: Secure REST API for managing product inventory with JWT authentication and scope-based authorization.
servers:
  - url: http://localhost:5001
    description: Development server

paths:
  /inventory:
    get:
      tags:
        - Inventory
      summary: List all products
      description: Retrieve a list of all products with current inventory levels. Requires `inventory:read` scope.
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - productId: PROD-001
                  name: Widget A
                  description: Standard widget
                  quantity: 50
                  lastUpdated: '2026-06-08T10:30:00Z'
                - productId: PROD-002
                  name: Widget B
                  description: Premium widget
                  quantity: 25
                  lastUpdated: '2026-06-08T11:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Inventory
      summary: Create or update product inventory
      description: Create a new product or update an existing product's inventory. Requires `inventory:write` scope.
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequest'
            example:
              productId: PROD-001
              name: Widget A
              description: Standard widget
              quantity: 100
      responses:
        '200':
          description: Product created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                productId: PROD-001
                name: Widget A
                description: Standard widget
                quantity: 100
                lastUpdated: '2026-06-08T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inventory/{id}:
    get:
      tags:
        - Inventory
      summary: Get product inventory details
      description: Retrieve inventory details for a specific product. Requires `inventory:read` scope.
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product identifier
          example: PROD-001
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                productId: PROD-001
                name: Widget A
                description: Standard widget
                quantity: 50
                lastUpdated: '2026-06-08T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Product:
      type: object
      required:
        - productId
        - quantity
        - lastUpdated
      properties:
        productId:
          type: string
          description: Unique product identifier
          example: PROD-001
        name:
          type: string
          description: Product name
          example: Widget A
        description:
          type: string
          description: Product description
          nullable: true
          example: Standard widget
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: Quantity on hand
          example: 50
        lastUpdated:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last update
          example: '2026-06-08T10:30:00Z'

    CreateInventoryRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          description: Unique product identifier
          example: PROD-001
        name:
          type: string
          description: Product name
          nullable: true
          example: Widget A
        description:
          type: string
          description: Product description
          nullable: true
          example: Standard widget
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: Quantity on hand (must be non-negative)
          example: 100

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code or type
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Quantity must be non-negative
        details:
          type: object
          description: Field-level validation errors
          nullable: true
          example:
            quantity: Quantity must be non-negative

  responses:
    BadRequest:
      description: Invalid request payload or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: VALIDATION_ERROR
            message: Quantity must be non-negative
            details:
              quantity: Quantity must be non-negative

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: UNAUTHORIZED
            message: Missing or invalid authentication token

    Forbidden:
      description: Authenticated but insufficient permissions (missing required scope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: FORBIDDEN
            message: Insufficient permissions; required scope not present

    NotFound:
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: Product not found

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2/JWT bearer token with inventory scopes. Use GET /dev/token in development to mint a token.
